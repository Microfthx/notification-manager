services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    user: "${NOTIFICATION_MANAGER_UID:-1000}:${NOTIFICATION_MANAGER_GID:-1000}"
    volumes:
      - ./backend/src:/usr/src/app/src
      - ./bots:/workspace/notification-manager/bots
      - ./logs:/workspace/notification-manager/logs
      - ./data:/workspace/notification-manager/data
      - ../aio-dynamic-push-master:/workspace/aio-dynamic-push-master:ro
      - /home/hxly/Napcat/opt/QQ/resources/app/app_launcher/napcat/config:/workspace/napcat-config:ro
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - PORT=4000
      - PROJECT_ROOT=/workspace/notification-manager
      - AIO_PROJECT_ROOT=/workspace/aio-dynamic-push-master
      - AIO_PYTHON_BIN=/opt/aio-venv/bin/python
      - CHROMIUM_PATH=/usr/bin/chromium
      - WEIBO_SESSION_INTERVAL_SECONDS=14400
      - WEIBO_SESSION_INITIAL_DELAY_SECONDS=60
      - BOT_AUTO_START_INTERVAL_SECONDS=15
      - NAPCAT_CONFIG_ROOT=/workspace/napcat-config
      - NAPCAT_WEBUI_URL=http://127.0.0.1:6099/api
      - NAPCAT_CHECK_INTERVAL_SECONDS=30
      - NAPCAT_OFFLINE_THRESHOLD=3
      - NAPCAT_ALERT_INTERVAL_SECONDS=21600

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "10010:10010"
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
    environment:
      - API_PROXY_TARGET=http://host.docker.internal:4000
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

networks:
  default:
    driver: bridge
